<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}" />

<!-- Language alternatives -->
{{ if .IsTranslated }}
{{ range .AllTranslations }}
<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}" />
{{ end }}
{{ else }}
<link rel="alternate" hreflang="en" href="{{ .Permalink }}" />
{{ end }}

<!-- Twitter Card Tags handled by headers.html -->

<!-- Additional SEO Meta Tags -->
<meta name="theme-color" content="#0a0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Preconnect to external resources (fonts handled by custom_headers.html) -->
<link rel="dns-prefetch" href="https://www.googletagmanager.com">
<link rel="dns-prefetch" href="https://www.google-analytics.com">

<!-- Last Modified for search engines -->
{{ with .Lastmod }}
<meta http-equiv="last-modified" content="{{ .Format "2006-01-02T15:04:05Z0700" }}">
{{ end }}
