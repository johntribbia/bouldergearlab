<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#0a0d14"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="190" x2="720" y2="190" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <line x1="0" y1="95"  x2="720" y2="95"  stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="180" y1="0" x2="180" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="360" y1="0" x2="360" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="540" y1="0" x2="540" y2="380" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Filled area under arc -->
  <path d="M 60 230 C 120 150 210 100 280 91 C 328 83 362 81 410 85 C 482 91 568 95 660 97 L 660 237 L 60 237 Z"
        fill="rgba(125,184,0,0.06)" />

  <!-- Baseline -->
  <line x1="48" y1="237" x2="672" y2="237" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Tick marks -->
  <line x1="60"  y1="235" x2="60"  y2="243" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="280" y1="235" x2="280" y2="243" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="410" y1="235" x2="410" y2="243" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="660" y1="235" x2="660" y2="243" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Dashed vertical guides -->
  <line x1="170" y1="121" x2="170" y2="251" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-dasharray="3,4"/>
  <line x1="345" y1="81"  x2="345" y2="251" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-dasharray="3,4"/>
  <line x1="535" y1="91"  x2="535" y2="251" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" stroke-dasharray="3,4"/>

  <!-- Arc segments -->
  <path d="M 60 230 C 120 150 210 100 280 91"
        fill="none" stroke="#7db800" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 280 91 C 328 83 362 81 410 85"
        fill="none" stroke="#a8c8d8" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 410 85 C 482 91 568 95 660 97"
        fill="none" stroke="#9d8fe8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Segment connector dots -->
  <circle cx="280" cy="91"  r="5.5" fill="rgba(255,255,255,0.10)" stroke="#7db800" stroke-width="2"/>
  <circle cx="410" cy="85"  r="5.5" fill="rgba(255,255,255,0.10)" stroke="#9d8fe8" stroke-width="2"/>

  <!-- Label cards -->
  <rect x="90"  y="255" width="160" height="62" rx="5" fill="rgba(125,184,0,0.07)"  stroke="#7db800" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="170" y="275" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#7db800">A - Assess</text>
  <text x="170" y="291" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(125,184,0,0.65)">build understanding first</text>

  <rect x="265" y="255" width="160" height="62" rx="5" fill="rgba(168,200,216,0.07)" stroke="#a8c8d8" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="345" y="275" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#a8c8d8">R - Repair</text>
  <text x="345" y="291" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(168,200,216,0.65)">peak execution,</text>
  <text x="345" y="304" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(168,200,216,0.65)">fix the break</text>

  <rect x="455" y="255" width="160" height="62" rx="5" fill="rgba(157,143,232,0.07)" stroke="#9d8fe8" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="535" y="275" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#9d8fe8">C - Calibrate</text>
  <text x="535" y="291" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(157,143,232,0.65)">hold quality,</text>
  <text x="535" y="304" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(157,143,232,0.65)">trust the signal</text>

  <!-- Start / end labels -->
  <text x="60"  y="327" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.22)">start</text>
  <text x="660" y="327" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.22)">end</text>

  <!-- Title -->
  <text x="360" y="54" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="20" fill="rgba(255,255,255,0.75)" letter-spacing="0.06em">ARC</text>
  <text x="360" y="76" text-anchor="middle" font-family="'Space Mono', monospace" font-size="11" fill="rgba(255,255,255,0.30)">Assess · Repair · Calibrate</text>
</svg>
