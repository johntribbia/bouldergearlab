<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#0a0d14"/>

  <!-- Grid lines — horizontal at 10% increments -->
  <!-- Scale: y_baseline=245, chart_height=195, 195/65 ≈ 3px per % -->
  <!-- 60%: y=245-180=65  50%: y=245-150=95  40%: y=245-120=125  30%: y=245-90=155  20%: y=245-60=185 -->
  <line x1="68" y1="185" x2="650" y2="185" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="68" y1="155" x2="650" y2="155" stroke="rgba(255,255,255,0.05)"  stroke-width="1"/>
  <line x1="68" y1="125" x2="650" y2="125" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
  <line x1="68" y1="95"  x2="650" y2="95"  stroke="rgba(255,255,255,0.05)"  stroke-width="1"/>
  <line x1="68" y1="65"  x2="650" y2="65"  stroke="rgba(255,255,255,0.035)" stroke-width="1"/>

  <!-- Baseline -->
  <line x1="62" y1="245" x2="654" y2="245" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Targeted highlight zones (groups 1 and 2) -->
  <rect x="92"  y="46" width="72" height="204" rx="2" fill="rgba(125,184,0,0.04)"/>
  <rect x="210" y="46" width="72" height="204" rx="2" fill="rgba(125,184,0,0.04)"/>

  <!-- ── Group 1: Excessive Hedging (TARGETED) ── -->
  <!-- Before 58.3% → y = 245 - 58.3*3 = 245 - 174.9 = 70.1 → y=70, h=175 -->
  <rect x="101" y="70"  width="24" height="175" rx="2" fill="rgba(224,112,85,0.82)"/>
  <!-- After 38.1% → y = 245 - 38.1*3 = 245 - 114.3 = 130.7 → y=131, h=114 -->
  <rect x="129" y="131" width="24" height="114" rx="2" fill="rgba(125,184,0,0.88)"/>
  <!-- Delta bracket -->
  <line x1="155" y1="70"  x2="168" y2="70"  stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
  <line x1="155" y1="131" x2="168" y2="131" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
  <line x1="168" y1="70"  x2="168" y2="131" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="2,3"/>
  <rect x="172" y="92"   width="38" height="16" rx="2" fill="rgba(125,184,0,0.12)"/>
  <text x="191" y="104" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="9.5" fill="#7db800">&#8722;20 pp</text>

  <!-- ── Group 2: Instruction-Following Failure (TARGETED) ── -->
  <!-- Before 54.7% → y = 245 - 164.1 = 80.9 → y=81, h=164 -->
  <rect x="219" y="81"  width="24" height="164" rx="2" fill="rgba(224,112,85,0.82)"/>
  <!-- After 37.4% → y = 245 - 112.2 = 132.8 → y=133, h=112 -->
  <rect x="247" y="133" width="24" height="112" rx="2" fill="rgba(125,184,0,0.88)"/>
  <!-- Delta bracket -->
  <line x1="273" y1="81"  x2="286" y2="81"  stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
  <line x1="273" y1="133" x2="286" y2="133" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
  <line x1="286" y1="81"  x2="286" y2="133" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="2,3"/>
  <rect x="290" y="100"  width="38" height="16" rx="2" fill="rgba(125,184,0,0.12)"/>
  <text x="309" y="112" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="9.5" fill="#7db800">&#8722;17 pp</text>

  <!-- ── Group 3: Weak Reasoning (not targeted) ── -->
  <!-- Before 49.2% → y=245-147.6=97.4 → y=97, h=148 -->
  <rect x="345" y="97"  width="24" height="148" rx="2" fill="rgba(224,112,85,0.32)"/>
  <!-- After 47.8% → y=245-143.4=101.6 → y=102, h=143 -->
  <rect x="373" y="102" width="24" height="143" rx="2" fill="rgba(125,184,0,0.32)"/>

  <!-- ── Group 4: Hallucination / Error (not targeted) ── -->
  <!-- Before 46.1% → y=245-138.3=106.7 → y=107, h=138 -->
  <rect x="455" y="107" width="24" height="138" rx="2" fill="rgba(224,112,85,0.32)"/>
  <!-- After 45.3% → y=245-135.9=109.1 → y=109, h=136 -->
  <rect x="483" y="109" width="24" height="136" rx="2" fill="rgba(125,184,0,0.32)"/>

  <!-- ── Group 5: Poor Formatting (not targeted) ── -->
  <!-- Before 43.8% → y=245-131.4=113.6 → y=114, h=131 -->
  <rect x="563" y="114" width="24" height="131" rx="2" fill="rgba(224,112,85,0.32)"/>
  <!-- After 42.1% → y=245-126.3=118.7 → y=119, h=126 -->
  <rect x="591" y="119" width="24" height="126" rx="2" fill="rgba(125,184,0,0.32)"/>

  <!-- Y-axis labels -->
  <text x="56" y="249" text-anchor="end" font-family="'Space Mono', monospace" font-size="8" fill="rgba(255,255,255,0.18)">0%</text>
  <text x="56" y="159" text-anchor="end" font-family="'Space Mono', monospace" font-size="8" fill="rgba(255,255,255,0.18)">30%</text>
  <text x="56" y="99"  text-anchor="end" font-family="'Space Mono', monospace" font-size="8" fill="rgba(255,255,255,0.18)">50%</text>

  <!-- Cluster labels -->
  <text x="128"  y="261" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(255,255,255,0.50)">Hedging</text>
  <text x="246"  y="261" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(255,255,255,0.50)">Instr.-following</text>
  <text x="372"  y="261" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(255,255,255,0.22)">Reasoning</text>
  <text x="482"  y="261" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(255,255,255,0.22)">Hallucination</text>
  <text x="604"  y="261" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(255,255,255,0.22)">Formatting</text>

  <!-- TARGETED labels above highlighted zones -->
  <text x="128" y="39" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(125,184,0,0.52)" letter-spacing="0.10em">TARGETED</text>
  <text x="246" y="39" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(125,184,0,0.52)" letter-spacing="0.10em">TARGETED</text>

  <!-- Legend -->
  <rect x="68" y="278" width="14" height="7" rx="1" fill="rgba(224,112,85,0.82)"/>
  <text x="88"  y="286" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.38)">Before</text>
  <rect x="134" y="278" width="14" height="7" rx="1" fill="rgba(125,184,0,0.88)"/>
  <text x="154" y="286" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.38)">After targeted instruction adjustment</text>

  <!-- Title block -->
  <text x="68" y="320" font-family="'Space Mono', monospace" font-weight="700" font-size="15" fill="rgba(255,255,255,0.86)" letter-spacing="0.02em">What Losing Responses Have in Common</text>
  <text x="68" y="342" font-family="'Space Mono', monospace" font-size="9.5" fill="rgba(255,255,255,0.28)" letter-spacing="0.06em">QUALITY FEEDBACK LOOP  &#183;  LOSS TAXONOMY  &#183;  SYSTEM INSTRUCTION HILL-CLIMBING</text>
</svg>
