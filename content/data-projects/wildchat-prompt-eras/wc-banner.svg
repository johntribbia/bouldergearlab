  <line x1="410" y1="60" x2="410" y2="243" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Image Generation area fill -->
  <path d="M 60,236 L 110,236 L 160,236 L 210,145 L 260,173 L 310,166 L 360,173 L 410,138 L 460,96 L 510,89 L 560,103 L 610,82 L 660,89 L 660,243 L 60,243 Z"
        fill="rgba(224,112,85,0.09)"/>

