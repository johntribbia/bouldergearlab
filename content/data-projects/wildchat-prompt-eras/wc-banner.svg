  <polyline
    points="60,236 110,236 160,236 210,145 260,173 310,166 360,173 410,138 460,96 510,89 560,103 610,82 660,89"
    fill="none" stroke="#e07055" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Coding area fill -->
  <path d="M 60,173 L 110,180 L 160,166 L 210,187 L 260,180 L 310,173 L 360,180 L 410,180 L 460,194 L 510,187 L 560,194 L 610,187 L 660,194 L 660,243 L 60,243 Z"
        fill="rgba(125,184,0,0.05)"/>

