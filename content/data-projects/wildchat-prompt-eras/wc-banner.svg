<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#0a0d14"/>

  <!-- Background grid -->
  <line x1="0"   y1="103" x2="720" y2="103" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0"   y1="173" x2="720" y2="173" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0"   y1="243" x2="720" y2="243" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="210" y1="60"  x2="210" y2="243" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="360" y1="60"  x2="360" y2="243" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="510" y1="60"  x2="510" y2="243" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Baseline -->
  <line x1="60" y1="243" x2="660" y2="243" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

