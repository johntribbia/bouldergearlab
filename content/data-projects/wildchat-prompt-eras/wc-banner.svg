  <polyline
    points="60,173 110,180 160,166 210,187 260,180 310,173 360,180 410,180 460,194 510,187 560,194 610,187 660,194"
    fill="none" stroke="#7db800" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

