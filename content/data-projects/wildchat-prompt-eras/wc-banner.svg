  <text x="60"  y="259" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.2)">Apr 23</text>
  <text x="410" y="259" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.32)">Nov 23</text>
  <text x="660" y="259" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.2)">Apr 24</text>

  <!-- Title block -->
  <text x="60" y="298" font-family="'Space Mono', monospace" font-weight="700" font-size="15" fill="rgba(255,255,255,0.85)" letter-spacing="0.02em">How Users Vote With Their Prompts</text>
  <text x="60" y="318" font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.28)" letter-spacing="0.05em">WILDCHAT-1M · BERTOPIC · GPT-3.5 → GPT-4 TURBO</text>
