  <!-- GPT-4 Turbo label -->
  <text x="414" y="74"  font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.45)">GPT-4 Turbo</text>
  <text x="414" y="85"  font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.25)">Nov 2023</text>

  <!-- Image Generation label + badge -->
  <rect x="462" y="68" width="140" height="15" rx="2" fill="rgba(224,112,85,0.12)"/>
  <text x="532" y="79" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="#e07055">Image Generation</text>
  <rect x="462" y="87" width="62" height="14" rx="2" fill="rgba(224,112,85,0.15)"/>
  <text x="493" y="98" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="10" fill="#e07055">+12.7 pp</text>

  <!-- Coding label -->
  <text x="66" y="160" font-family="'Space Mono', monospace" font-size="10" fill="rgba(125,184,0,0.75)">Coding</text>

  <!-- Casual label -->
  <text x="66" y="213" font-family="'Space Mono', monospace" font-size="9" fill="rgba(168,200,216,0.4)">Casual chat</text>

  <!-- Y-axis labels -->
  <text x="54" y="247" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">0%</text>
  <text x="54" y="177" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">10%</text>
  <text x="54" y="107" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">20%</text>

