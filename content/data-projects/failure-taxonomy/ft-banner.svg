<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#0a0d14"/>

  <!-- Background grid -->
  <line x1="72" y1="55"  x2="592" y2="55"  stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="3,5"/>
  <line x1="72" y1="103" x2="592" y2="103" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="72" y1="150" x2="592" y2="150" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="72" y1="198" x2="592" y2="198" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="72" y1="245" x2="592" y2="245" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- Vertical cycle guides -->
  <line x1="200" y1="55" x2="200" y2="245" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="390" y1="55" x2="390" y2="245" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="580" y1="55" x2="580" y2="245" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Divergence zone highlight (Cycle 2 → Cycle 3) -->
  <rect x="390" y="55" width="190" height="190" fill="rgba(125,184,0,0.025)" rx="0"/>

  <!-- Taxonomy-Routed filled area -->
  <path d="M 200,127 L 390,103 L 580,84 L 580,245 L 200,245 Z"
        fill="rgba(125,184,0,0.07)"/>

  <!-- Naive (Uniform) line: 55%, 55%, 45% → y=141, 141, 160 -->
  <polyline points="200,141 390,141 580,160"
            fill="none" stroke="#a8c8d8" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Taxonomy-Routed line: 62%, 75%, 85% → y=127, 103, 84 -->
  <polyline points="200,127 390,103 580,84"
            fill="none" stroke="#7db800" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Baseline -->
  <line x1="62" y1="245" x2="594" y2="245" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Cycle tick marks -->
  <line x1="200" y1="243" x2="200" y2="253" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <line x1="390" y1="243" x2="390" y2="253" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <line x1="580" y1="243" x2="580" y2="253" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Open circles: Cycle 1 and Cycle 2 -->
  <circle cx="200" cy="127" r="4" fill="#0a0d14" stroke="#7db800"  stroke-width="2"/>
  <circle cx="390" cy="103" r="4" fill="#0a0d14" stroke="#7db800"  stroke-width="2"/>
  <circle cx="200" cy="141" r="4" fill="#0a0d14" stroke="#a8c8d8" stroke-width="2"/>
  <circle cx="390" cy="141" r="4" fill="#0a0d14" stroke="#a8c8d8" stroke-width="2"/>

  <!-- Filled endpoint circles: Cycle 3 -->
  <circle cx="580" cy="84"  r="5" fill="#7db800"  opacity="0.95"/>
  <circle cx="580" cy="160" r="5" fill="#a8c8d8" opacity="0.9"/>

  <!-- Divergence bracket -->
  <line x1="588" y1="84"  x2="608" y2="84"  stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <line x1="588" y1="160" x2="608" y2="160" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <line x1="608" y1="84"  x2="608" y2="160" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Annotation box -->
  <rect x="614" y="107" width="56" height="30" rx="3"
        fill="rgba(125,184,0,0.09)" stroke="rgba(125,184,0,0.30)" stroke-width="0.8"/>
  <text x="642" y="119" text-anchor="middle"
        font-family="'Space Mono', monospace" font-weight="700" font-size="10" fill="#7db800">+40 pp</text>
  <text x="642" y="131" text-anchor="middle"
        font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(125,184,0,0.55)">gap</text>

  <!-- Strategy inline labels -->
  <text x="210" y="93"
        font-family="'Space Mono', monospace" font-size="10" fill="rgba(125,184,0,0.80)">Taxonomy-Routed</text>
  <text x="210" y="162"
        font-family="'Space Mono', monospace" font-size="10" fill="rgba(168,200,216,0.65)">Naive (Uniform)</text>

  <!-- Y-axis labels -->
  <text x="67" y="59"  text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.22)">100%</text>
  <text x="67" y="107" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">75%</text>
  <text x="67" y="154" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">50%</text>
  <text x="67" y="202" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">25%</text>
  <text x="67" y="249" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">0%</text>

  <!-- X-axis labels -->
  <text x="200" y="265" text-anchor="middle"
        font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.28)">Cycle 1</text>
  <text x="390" y="265" text-anchor="middle"
        font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.28)">Cycle 2</text>
  <text x="580" y="265" text-anchor="middle"
        font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.28)">Cycle 3</text>

  <!-- Separator -->
  <line x1="72" y1="280" x2="648" y2="280" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Title block -->
  <text x="72" y="310"
        font-family="'Space Mono', monospace" font-weight="700" font-size="16"
        fill="rgba(255,255,255,0.85)" letter-spacing="0.02em">The Repair Requires a Diagnosis</text>
  <text x="72" y="331"
        font-family="'Space Mono', monospace" font-size="10"
        fill="rgba(255,255,255,0.28)" letter-spacing="0.05em">FAILURE TAXONOMY · MAST (NeurIPS 2025) · N=1,000 SYNTHETIC</text>
  <text x="72" y="350"
        font-family="'Space Mono', monospace" font-size="9"
        fill="rgba(255,255,255,0.18)" letter-spacing="0.04em">TAXONOMY-ROUTED REPAIR vs. NAIVE · 3 CYCLES · % QUALITY RECOVERED</text>
</svg>
