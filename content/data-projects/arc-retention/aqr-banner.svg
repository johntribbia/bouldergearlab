<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <rect width="720" height="380" fill="#0a0d14"/>

  <!-- Background grid -->
  <line x1="0" y1="112" x2="720" y2="112" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="164" x2="720" y2="164" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="216" x2="720" y2="216" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="264" y1="55" x2="264" y2="270" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="456" y1="55" x2="456" y2="270" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- Early phase band (steps 1–3, x: 72–200) -->
  <rect x="72" y="55" width="128" height="215" fill="rgba(125,184,0,0.04)"/>
  <line x1="200" y1="55" x2="200" y2="275" stroke="rgba(125,184,0,0.22)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="136" y="72" text-anchor="middle" font-family="'Space Mono', monospace" font-size="8" fill="rgba(125,184,0,0.42)" letter-spacing="0.07em">EARLY PHASE</text>

  <!-- Filled area under Coding trajectory -->
  <path d="M 72,122 L 136,112 L 200,102 L 264,102 L 328,107 L 392,107 L 456,112 L 520,117 L 584,117 L 648,122 L 648,268 L 72,268 Z"
        fill="rgba(125,184,0,0.06)"/>

  <!-- General QA — subtle dashed reference (ice) -->
  <polyline points="72,112 136,107 200,112 264,112 328,112 392,117 456,112 520,112 584,117 648,112"
            fill="none" stroke="#a8c8d8" stroke-width="1.2" stroke-opacity="0.22"
            stroke-dasharray="4,4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Math/Logic — Early Collapse (purple, secondary) -->
  <polyline points="72,91 136,112 200,143 264,174 328,195 392,200 456,206 520,206 584,200 648,206"
            fill="none" stroke="#9d8fe8" stroke-width="2" stroke-opacity="0.55"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Creative Writing — Early Collapse (orange, primary) -->
  <polyline points="72,112 136,133 200,159 264,185 328,206 392,211 456,216 520,216 584,211 648,211"
            fill="none" stroke="#e07055" stroke-width="2.8"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Coding — Healthy trajectory (moss, primary) -->
  <polyline points="72,122 136,112 200,102 264,102 328,107 392,107 456,112 520,117 584,117 648,122"
            fill="none" stroke="#7db800" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Endpoint dots -->
  <circle cx="648" cy="122" r="4.5" fill="#7db800" opacity="0.9"/>
  <circle cx="648" cy="211" r="4.5" fill="#e07055" opacity="0.9"/>
  <circle cx="648" cy="206" r="3.5" fill="#9d8fe8" opacity="0.7"/>

  <!-- Divergence bracket -->
  <line x1="655" y1="122" x2="655" y2="211" stroke="rgba(255,255,255,0.14)" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="648" y1="122" x2="663" y2="122" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>
  <line x1="648" y1="211" x2="663" y2="211" stroke="rgba(255,255,255,0.24)" stroke-width="1"/>

  <!-- P(return) annotation -->
  <rect x="665" y="153" width="48" height="30" rx="3" fill="rgba(125,184,0,0.09)" stroke="rgba(125,184,0,0.30)" stroke-width="0.8"/>
  <text x="689" y="165" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="9.5" fill="#7db800">+4pp</text>
  <text x="689" y="177" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="rgba(125,184,0,0.55)">P(return)</text>

  <!-- Baseline -->
  <line x1="62" y1="268" x2="660" y2="268" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>

  <!-- Step ticks -->
  <line x1="72"  y1="266" x2="72"  y2="275" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <line x1="200" y1="266" x2="200" y2="275" stroke="rgba(125,184,0,0.30)" stroke-width="1"/>
  <line x1="648" y1="266" x2="648" y2="275" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <!-- Step axis labels -->
  <text x="72"  y="285" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.22)">step 1</text>
  <text x="200" y="285" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="rgba(125,184,0,0.42)">step 3</text>
  <text x="648" y="285" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.22)">step 10</text>

  <!-- Y-axis score labels -->
  <text x="62" y="116" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">0.70</text>
  <text x="62" y="168" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">0.60</text>
  <text x="62" y="220" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="rgba(255,255,255,0.18)">0.50</text>

  <!-- Title block -->
  <text x="360" y="318" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="16" fill="rgba(255,255,255,0.72)" letter-spacing="0.07em">THE SHAPE PREDICTS THE RETURN</text>
  <text x="360" y="340" text-anchor="middle" font-family="'Space Mono', monospace" font-size="10" fill="rgba(255,255,255,0.27)" letter-spacing="0.04em">ARC trajectory scores × 7-day return probability</text>

  <!-- Legend -->
  <line x1="174" y1="362" x2="202" y2="362" stroke="#7db800" stroke-width="2.5"/>
  <text x="207" y="366" font-family="'Space Mono', monospace" font-size="9" fill="rgba(125,184,0,0.58)" letter-spacing="0.04em">Healthy trajectory</text>
  <line x1="404" y1="362" x2="432" y2="362" stroke="#e07055" stroke-width="2.5"/>
  <text x="437" y="366" font-family="'Space Mono', monospace" font-size="9" fill="rgba(224,112,85,0.58)" letter-spacing="0.04em">Early Collapse</text>
</svg>
